<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urna de Treinamento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}?v={{ v }}">
</head>
<body>
    <div class="login">
        <h2>LOGIN</h2>
        <div class="cpf">
            <p>CPF</p>
            <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
            <p id="erro" class="erro"></p>
            <button type="button" id="entrar"><b>Entrar</b></button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v={{ v }}"></script>
</body>
</html>
